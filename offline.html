<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c1120"><title>인터넷 연결 확인 · 한자 티어</title><style>body{margin:0;background:#0c1120;color:#eaf1ff;font:18px/1.7 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{max-width:460px;margin:24px;padding:30px;background:#18223b;border-radius:24px}h1{font-size:26px}p{color:#becbe2}button{padding:14px 24px;border:0;border-radius:12px;background:#7363ff;color:white;font-size:18px;cursor:pointer}</style></head><body><main><span aria-hidden="true">📶</span><h1>인터넷 연결을 확인해 주세요</h1><p>앱은 설치되어 있어요. 로그인하고 학습 기록을 안전하게 저장하려면 인터넷에 연결해야 해요.</p><p>Wi-Fi 또는 데이터를 켠 뒤 다시 시도해 주세요.</p><button id="retry">다시 연결하기</button></main><script>document.getElementById('retry').onclick=()=>location.reload();</script></body></html>
