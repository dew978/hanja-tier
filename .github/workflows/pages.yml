name: 한자 티어 웹앱 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 학습 규칙 및 설치 파일 검증
        run: |
          node tests/hanja.test.cjs
          node tests/hanja-storage.test.cjs
          node tests/pwa.test.cjs
      - uses: actions/configure-pages@v5
      - name: 공개 웹 파일만 준비
        run: |
          mkdir _site
          cp index.html offline.html manifest.webmanifest sw.js .nojekyll _site/
          cp -R css icons js _site/
          rm _site/js/preview-seed.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
