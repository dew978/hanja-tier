<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e3730">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="한자 티어">
  <meta name="description" content="한자 8급부터 6급까지. 뜻·음·따라쓰기로 매일 배우는 한자 티어.">
  <link rel="manifest" href="preview.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/hanja.css?v=prompt-1">
  <link rel="stylesheet" href="css/ink-theme.css?v=ink-1">
  <title>한자 티어</title>
</head>
<body>
  <header id="app-header" class="topbar hidden">
    <div class="brand"><span class="brand-mark" aria-hidden="true">學</span> 한자 티어</div>
    <span id="account-name" class="top-me"></span>
    <button class="btn ghost sm" data-install>앱 설치</button>
    <button class="btn ghost sm" data-password>비밀번호 변경</button>
    <button class="btn ghost sm" data-logout>로그아웃</button>
  </header>
  <section id="scr-loading" class="screen center"><span class="brand-mark large">學</span><p id="loading-msg" class="muted" role="status">학습 준비 중…</p></section>
  <section id="scr-login" class="screen center hidden">
    <div class="auth-card"><span class="brand-mark large" aria-hidden="true">學</span><h1>한자 티어</h1><p class="muted">뜻 · 음 · 획순 연습</p><div class="login-chars" aria-hidden="true">學 文 字</div><p class="note">한자 8급 → 6급 · 하루 최대 10자 · 5자씩 학습</p>
      <form id="login-form"><label>아이디<input id="login-id" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>비밀번호<input id="login-pw" type="password" autocomplete="current-password" required></label><button class="btn primary lg" type="submit">한자 학습 입장</button><p id="login-err" class="err" role="alert"></p></form>
      <button class="btn ghost" data-install>이 기기에 앱 설치</button><p class="note">선생님이 발급한 계정으로 로그인</p><p class="demo-note hidden" id="demo-note">체험 모드 · 현재 브라우저에만 저장</p>
    </div>
  </section>
  <section id="scr-setup" class="screen center hidden"><div class="auth-card"><span class="brand-mark large">學</span><h1>한자 티어 처음 설정</h1><p class="note">관리자 아이디: master</p><form id="setup-form"><label>반 이름<input id="setup-class" maxlength="50" required></label><label>관리자 비밀번호<input id="setup-pw" type="password" minlength="6" autocomplete="new-password" required></label><button class="btn primary" type="submit">시작하기</button><p id="setup-err" class="err" role="alert"></p></form></div></section>
  <section id="scr-student" class="screen hidden"><main id="st-main" class="page" aria-label="한자 학습"></main></section>
  <section id="scr-teacher" class="screen hidden"><nav id="tc-tabs" class="admin-tabs" aria-label="한자 관리 메뉴"></nav><main id="tc-main" class="page" aria-label="한자 학습 관리"></main></section>
  <div id="modal-root"></div><div id="toast-root" role="status" aria-live="polite"></div>
  <script src="js/preview-seed.js"></script>
  <script src="js/hanja.js"></script>
  <script src="js/hanja-engine.js?v=batch-1"></script>
  <script src="js/backend.js"></script>
  <script src="js/hanja-app.js?v=copy-1"></script>
  <script src="js/hanja-strokes.js?v=batch-1"></script>
  <script src="js/stroke-practice.js?v=copy-1"></script>
  <script src="js/hanja-learning.js?v=prompt-1"></script>
  <script src="js/hanja-admin.js?v=copy-1"></script>
</body>
</html>
